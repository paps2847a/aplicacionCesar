    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        var file = (event && event.filename) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          file.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = String((reason && (reason.message || reason)) || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          String((reason && reason.stack) || '').includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
